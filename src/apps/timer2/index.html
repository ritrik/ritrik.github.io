<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Časovač</title>

  <!-- Písmo terminálového vzhledu (jako v původní verzi). Kdyby nebyl internet,
       spadne se na systémové monospace. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />

  <!-- Ikony počasí (stejná knihovna jako hlavní web → sdílená cache) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" integrity="sha256-pdY4ejLKO67E0CM2tbPtq1DJ3VGDVVdqAR6j3ZwdiE4=" crossorigin="anonymous" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Odpočet do konce směny (nebo do vlastního času přes ?until=HH:MM) -->
  <main id="screen">
    <div id="countdown">--:--:--</div>
    <div id="target"></div>
    <div id="weather"></div>
    <div id="bar">
      <div id="bar-fill"></div>
    </div>
  </main>

  <!-- Patička: vlevo nenápadná nápověda, vpravo živé hodiny -->
  <footer id="footer">
    <span id="hint">dvojklik = celá obrazovka · <code>?until=HH:MM</code></span>
    <span id="clock">--:--:--</span>
  </footer>

  <script src="timer.js"></script>
</body>
</html>
