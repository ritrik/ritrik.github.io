# Písma (Eleventy global data → v šablonách jako `fonts.*`).
#   google              = písma načtená z Google Fonts (name = popisek pro odkaz, spec = dotaz CSS2 API)
#   headings/text/mono  = rodiny dosazené do CSS proměnných --font-headings / --font-text / --font-mono
# „headings" je nadpisové písmo bez ohledu na styl (klidně sans). Swap písma = úprava tady.
# `spec` musí být v uvozovkách (obsahuje : a @).

google:
  - name: Manrope
    spec: "Manrope:wght@400;500;600;700"
  - name: Inter
    spec: "Inter:ital,wght@0,400;0,600;0,700;1,400"
  - name: JetBrains Mono
    spec: "JetBrains+Mono:ital,wght@0,400;0,700;1,400"

headings: '"Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
text: '"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
mono: '"JetBrains Mono", SFMono-Regular, "SF Mono", Menlo, Consolas, ui-monospace, monospace'
